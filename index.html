<!doctype html>
<html lang="nl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tafels</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div class="container text-center">
    <div class="row justify-content-center">

      <div class="card" style="width: 18rem;">

        <div class="card-body">
          <h5 class="card-title">Tafels</h5>

          <p class="card-text">
            Welke tafel wil je zien?
          </p>

          <input id="tafelnummer" type="number" class="form-control mb-3" min="1" max="10" placeholder="Tafelnummer">

          <button id="tafelKnop" class="btn btn-primary">
            Laat tafel zien
          </button>

          <p id="resultaat" class="mt-3"></p>

        </div>

      </div>

    </div>
  </div>
  <script> src="script.js"</script>
</body>
