
<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tafeltrainer | Leer rekenen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #10172e, #25204d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .app-card {
            background: #ffffff;
            color: #20243a;
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #eeeaff;
            color: #7048e8;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 15px;
        }

        .subtitle {
            color: #85899b;
            font-size: 14px;
        }

        .question {
            background: #f4f1ff;
            border-radius: 18px;
            padding: 30px 10px;
            margin: 25px 0;
        }

        .question h2 {
            font-size: 42px;
            font-weight: bold;
            color: #7048e8;
            margin: 0;
        }

        .form-control {
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
        }

        .btn-purple {
            background: #7048e8;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: bold;
        }

        .btn-purple:hover {
            background: #5933c5;
            color: white;
        }

        .btn-purple:disabled {
            background: #b9aadf;
            color: white;
        }

        .btn-next {
            background: #20243a;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: bold;
        }

        .btn-next:hover {
            background: #343a55;
            color: white;
        }

        .progress {
            height: 9px;
            border-radius: 20px;
            background: #eeeaf7;
        }

        .progress-bar {
            background: #7048e8;
        }

        .feedback {
            min-height: 28px;
            font-weight: bold;
        }

        .stats {
            background: #f7f7fb;
            padding: 15px;
            border-radius: 14px;
        }

        .stats strong {
            font-size: 22px;
            color: #7048e8;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="app-card">

        <div class="text-center">

            <div class="logo">✖</div>

            <h3 class="fw-bold">Tafeltrainer</h3>

            <p class="subtitle">
                Oefen je tafels en word steeds beter!
            </p>

        </div>

        <div id="spel">

            <div class="d-flex justify-content-between mb-2">
                <small>Voortgang</small>
                <small id="vraagnummer">0 / 10</small>
            </div>

            <div class="progress">
                <div id="voortgang" class="progress-bar"
                     style="width: 0%">
                </div>
            </div>

            <div class="question text-center">
                <h2 id="som">Klaar om te starten?</h2>
            </div>

            <label for="antwoord" class="form-label fw-bold">
                Wat is het antwoord?
            </label>

            <input
                type="number"
                id="antwoord"
                class="form-control mb-3"
                placeholder="Typ je antwoord"
                disabled
            >

            <p id="feedback" class="feedback text-center"></p>

            <button id="controleer" class="btn btn-purple w-100 mb-2" disabled>
                Controleer antwoord
            </button>

            <button id="volgende" class="btn btn-next w-100" disabled>
                Volgende vraag →
            </button>

        </div>

        <div class="stats d-flex justify-content-around text-center mt-4">

            <div>
                <strong id="score">0</strong>
                <div class="subtitle">Goed</div>
            </div>

            <div>
                <strong id="fout">0</strong>
                <div class="subtitle">Fout</div>
            </div>

            <div>
                <strong id="totaal">10</strong>
                <div class="subtitle">Vragen</div>
            </div>

        </div>

        <div id="eindscherm" class="hidden text-center mt-4">

            <h3 class="fw-bold">Goed gedaan! 🎉</h3>

            <p id="eindtekst"></p>

            <button id="opnieuw" class="btn btn-purple w-100">
                Opnieuw oefenen
            </button>

        </div>

        <button id="start" class="btn btn-purple w-100 mt-3">
            Start oefening
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
